<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlaParkCar - Garajes en España</title>

  <!-- PWA CONFIGURE: Hace que salte la ventana de instalación al abrir el enlace -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BlaParkCar" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

  <!-- AVISO AUTOMÁTICO DE INSTALACIÓN PARA CUALQUIER PERSONA QUE ABRA EL ENLACE -->
  <div id="pwa-install-banner" class="hidden fixed top-0 left-0 right-0 z-50 bg-emerald-500 text-slate-950 px-4 py-3 shadow-2xl flex items-center justify-between font-bold text-xs">
    <div class="flex items-center space-x-2">
      <span class="bg-slate-950 text-emerald-400 w-6 h-6 rounded-lg flex items-center justify-center font-black">P</span>
      <span>¿Quieres instalar BlaParkCar en tu teléfono?</span>
    </div>
    <div class="flex items-center space-x-2">
      <button id="pwa-btn-install" class="bg-slate-950 text-white px-3 py-1.5 rounded-lg text-xs font-black shadow">
        Instalar App
      </button>
      <button onclick="document.getElementById('pwa-install-banner').classList.add('hidden')" class="text-slate-950 p-1 font-black">✕</button>
    </div>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    function App() {
      return (
        <div className="min-h-screen flex flex-col justify-between">
          <header className="bg-slate-950 border-b border-slate-800 px-4 py-3 sticky top-0 z-40">
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <div className="w-8 h-8 bg-emerald-500 text-slate-950 font-black rounded-xl flex items-center justify-center text-lg">P</div>
                <span className="text-xl font-black text-white">BlaPark<span className="text-emerald-400">Car</span></span>
              </div>
              <span className="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">
                App Instalable PWA
              </span>
            </div>
          </header>

          <main className="max-w-md mx-auto w-full p-6 text-center space-y-6 my-auto">
            <div className="bg-slate-950 p-8 rounded-3xl border border-slate-800 space-y-4 shadow-2xl">
              <div className="w-16 h-16 bg-emerald-500 text-slate-950 font-black text-3xl rounded-2xl flex items-center justify-center mx-auto shadow-lg">
                P
              </div>
              <h1 className="text-2xl font-black text-white">BlaParkCar</h1>
              <p className="text-slate-300 text-xs leading-relaxed">
                Plataforma de alquiler de plazas de garaje entre particulares en España.
              </p>
              
              <div className="pt-4 border-t border-slate-800 space-y-3">
                <button 
                  id="pwa-main-button"
                  className="w-full py-3.5 bg-emerald-500 text-slate-950 font-black rounded-xl text-sm transition shadow-lg hover:bg-emerald-400"
                >
                  📲 Instalar App en este Móvil
                </button>
              </div>
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // CAPTURA EL EVENTO DE INSTALACIÓN AUTOMÁTICA EN ANDROID / NAVEGADORES
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      
      // Muestra la barra superior flotante
      document.getElementById('pwa-install-banner').classList.remove('hidden');

      const triggerInstall = () => {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            console.log('El usuario ha instalado la App');
          }
          deferredPrompt = null;
        });
      };

      document.getElementById('pwa-btn-install').addEventListener('click', triggerInstall);
      document.getElementById('pwa-main-button').addEventListener('click', triggerInstall);
    });
  </script>
</body>
</html>
