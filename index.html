<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlaParkCar</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide-react@0.263.1/dist/umd/lucide-react.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { 
      Car, MapPin, Calendar, Clock, ShieldCheck, Zap, 
      Key, QrCode, Search, PlusCircle, User, CreditCard, 
      CheckCircle, Sliders, DollarSign, ArrowRight, X, ChevronRight,
      TrendingUp, Award, Lock, Sparkles, Navigation, Bell, Star,
      ToggleLeft, ToggleRight, Radio, RefreshCw, Cpu, Layers, Building, HelpCircle 
    } = lucideReact;

    fetch('./src/App.jsx')
      .then(res => res.text())
      .then(code => {
        const cleanCode = code
          .replace(/import\s+React.*?from\s+['"]react['"];?/g, '')
          .replace(/import\s+\{[\s\S]*?\}\s+from\s+['"]lucide-react['"];?/g, '');
        
        const App = Babel.transform(cleanCode, { presets: ['react'] }).code;
        eval(App);
        
        ReactDOM.createRoot(document.getElementById('root')).render(
          React.createElement(window.App.default || window.App)
        );
      })
      .catch(err => {
        document.getElementById('root').innerHTML = '<div style="padding:20px;text-align:center;font-family:sans-serif;"><h3>Cargando BlaParkCar...</h3><p>Si tarda mucho, recarga la página.</p></div>';
      });
  </script>
</body>
</html>
