<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlaParkCar - Garajes entre Particulares</title>
  
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BlaParkCar" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">

  <!-- AVISO SUPERIOR DE INSTALACIÓN PWA -->
  <div id="pwa-install-banner" class="hidden fixed top-0 left-0 right-0 z-50 bg-emerald-500 text-slate-950 px-4 py-3 shadow-2xl flex items-center justify-between font-bold text-xs">
    <div class="flex items-center space-x-2">
      <span class="bg-slate-950 text-emerald-400 w-6 h-6 rounded-lg flex items-center justify-center font-black">P</span>
      <span>¿Quieres instalar la App BlaParkCar en tu móvil?</span>
    </div>
    <div class="flex items-center space-x-2">
      <button id="pwa-btn-install" class="bg-slate-950 text-white px-3 py-1.5 rounded-lg text-xs font-black shadow">
        Instalar Ahora
      </button>
      <button onclick="document.getElementById('pwa-install-banner').classList.add('hidden')" class="text-slate-950 p-1 font-black">✕</button>
    </div>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    const INITIAL_SPACES = [
      {
        id: 1,
        title: "Plaza amplísima junto a Estación Santa Justa",
        city: "Sevilla",
        neighborhood: "Santa Justa / Nervión",
        address: "Calle Pablo Iglesias, 8",
        pricePerHour: 2.30,
        pricePerDay: 16.00,
        ownerName: "Carlos M.",
        ownerRating: 4.9,
        reviewsCount: 34,
        features: { covered: true, electricCharger: true, autoDoor: true, maxSize: "SUV / Grande" },
        image: "https://images.unsplash.com/photo-1506521781263-d8422e82f27a?auto=format&fit=crop&q=80&w=600"
      },
      {
        id: 2,
        title: "Plaza VIP junto a Estación de Atocha",
        city: "Madrid",
        neighborhood: "Retiro / Arganzuela",
        address: "Calle de Méndez Álvaro, 12",
        pricePerHour: 3.20,
        pricePerDay: 22.00,
        ownerName: "Patricia L.",
        ownerRating: 4.95,
        reviewsCount: 52,
        features: { covered: true, electricCharger: true, autoDoor: true, maxSize: "Cualquier tamaño" },
        image: "https://images.unsplash.com/photo-1590674899484-d5640e854abe?auto=format&fit=crop&q=80&w=600"
      },
      {
        id: 3,
        title: "Garaje céntrico junto a Mezquita",
        city: "Córdoba",
        neighborhood: "Centro / Vial Norte",
        address: "Avenida de América, 14",
        pricePerHour: 1.90,
        pricePerDay: 13.50,
        ownerName: "Manuel R.",
        ownerRating: 4.85,
        reviewsCount: 22,
        features: { covered: true, electricCharger: false, autoDoor: true, maxSize: "Mediano / Berlina" },
        image: "https://images.unsplash.com/photo-1573348722427-f1d6819fdf98?auto=format&fit=crop&q=80&w=600"
      }
    ];

    function App() {
      const [appMode, setAppMode] = React.useState('DRIVER');
      const [driverTab, setDriverTab] = React.useState('search');
      const [ownerTab, setOwnerTab] = React.useState('dashboard');

      const [spaces, setSpaces] = React.useState(INITIAL_SPACES);
      const [searchCity, setSearchCity] = React.useState('');
      const [filterCharger, setFilterCharger] = React.useState(false);
      
      const [userBookings, setUserBookings] = React.useState([
        {
          id: "RES-9821",
          spaceTitle: "Plaza junto a Estación Santa Justa",
          city: "Sevilla",
          address: "Calle Pablo Iglesias, 8",
          pinCode: "4829",
          totalPrice: 18.40
        }
      ]);

      const [mySpaces, setMySpaces] = React.useState([
        { id: 101, title: "Mi plaza en Sevilla Nervión", city: "Sevilla", pricePerHour: 2.20, isVacant: true }
      ]);

      const [selectedSpace, setSelectedSpace] = React.useState(null);
      const [hours, setHours] = React.useState(4);

      const filteredSpaces = spaces.filter(s => {
        const matchCity = !searchCity || s.city.toLowerCase().includes(searchCity.toLowerCase()) || s.neighborhood.toLowerCase().includes(searchCity.toLowerCase());
        const matchCharger = !filterCharger || s.features.electricCharger;
        return matchCity && matchCharger;
      });

      const handleConfirmBooking = () => {
        if (!selectedSpace) return;
        const pin = Math.floor(1000 + Math.random() * 9000).toString();
        const total = (selectedSpace.pricePerHour * hours + 1.20).toFixed(2);
        const booking = {
          id: `RES-${pin}`,
          spaceTitle: selectedSpace.title,
          city: selectedSpace.city,
          address: selectedSpace.address,
          pinCode: pin,
          totalPrice: parseFloat(total)
        };
        setUserBookings([booking, ...userBookings]);
        alert(`¡Reserva realizada con éxito!\n\nTu PIN de entrada al garaje es: ${pin}`);
        setSelectedSpace(null);
        setDriverTab('bookings');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between pt-8">
          
          <header className="bg-slate-950 border-b border-slate-800 px-4 py-3 sticky top-0 z-40">
            <div className="max-w-6xl mx-auto flex items-center justify-between">
              
              <div className="flex items-center space-x-2">
                <div className="w-8 h-8 bg-emerald-500 text-slate-950 font-black rounded-xl flex items-center justify-center text-lg">P</div>
                <span className="text-xl font-black text-white">BlaPark<span className={appMode === 'DRIVER' ? 'text-emerald-400' : 'text-violet-400'}>Car</span></span>
              </div>

              <div className="flex bg-slate-900 p-1 rounded-2xl border border-slate-800">
                <button 
                  onClick={() => setAppMode('DRIVER')} 
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${appMode === 'DRIVER' ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400'}`}>
                  🚗 Conductor
                </button>
                <button 
                  onClick={() => setAppMode('OWNER')} 
                  className={`px-3 py-1.5 rounded-xl text-xs font-bold transition ${appMode === 'OWNER' ? 'bg-violet-600 text-white shadow' : 'text-slate-400'}`}>
                  🏢 Propietario
                </button>
              </div>

            </div>
          </header>

          {appMode === 'DRIVER' && (
            <main className="max-w-6xl mx-auto w-full p-4 sm:p-6 space-y-6 flex-1">
              
              <div className="flex space-x-2 border-b border-slate-800 pb-3">
                <button 
                  onClick={() => setDriverTab('search')} 
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition ${driverTab === 'search' ? 'bg-slate-800 text-emerald-400' : 'text-slate-400'}`}>
                  🔍 Buscar Garaje
                </button>
                <button 
                  onClick={() => setDriverTab('bookings')} 
                  className={`px-4 py-2 rounded-xl text-xs font-bold transition ${driverTab === 'bookings' ? 'bg-slate-800 text-emerald-400' : 'text-slate-400'}`}>
                  🔑 Mis Reservas ({userBookings.length})
                </button>
              </div>

              {driverTab === 'search' && (
                <>
                  <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 flex flex-col sm:flex-row gap-3">
                    <input 
                      type="text"
                      placeholder="Buscar por ciudad (Sevilla, Madrid, Córdoba)..."
                      value={searchCity}
                      onChange={e => setSearchCity(e.target.value)}
                      className="flex-1 bg-slate-900 border border-slate-700 px-4 py-2.5 rounded-xl text-sm focus:outline-none text-white"
                    />
                    <button 
                      onClick={() => setFilterCharger(!filterCharger)}
                      className={`px-4 py-2.5 rounded-xl text-xs font-bold border transition ${filterCharger ? 'bg-cyan-500/20 text-cyan-300 border-cyan-500' : 'bg-slate-900 text-slate-400 border-slate-700'}`}>
                      ⚡ Cargador Eléctrico
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {filteredSpaces.map(space => (
                      <div key={space.id} className="bg-slate-950 rounded-2xl border border-slate-800 overflow-hidden flex flex-col justify-between hover:border-slate-700 transition">
                        <div>
                          <img src={space.image} className="h-44 w-full object-cover" />
                          <div className="p-4 space-y-2">
                            <div className="flex justify-between items-center">
                              <span className="text-[10px] font-bold bg-emerald-500/20 text-emerald-400 px-2.5 py-0.5 rounded-full">{space.city}</span>
                              <span className="text-xs text-slate-400">⭐ {space.ownerRating} ({space.reviewsCount})</span>
                            </div>
                            <h3 className="font-bold text-white text-base">{space.title}</h3>
                            <p className="text-xs text-slate-400">{space.address} ({space.neighborhood})</p>
                          </div>
                        </div>

                        <div className="p-4 border-t border-slate-900 flex items-center justify-between">
                          <div>
                            <span className="text-lg font-black text-emerald-400">{space.pricePerHour.toFixed(2)} €</span>
                            <span className="text-xs text-slate-500"> / hora</span>
                          </div>
                          <button 
                            onClick={() => setSelectedSpace(space)}
                            className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs px-4 py-2.5 rounded-xl transition shadow">
                            Reservar Plaza
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </>
              )}

              {driverTab === 'bookings' && (
                <div className="space-y-4">
                  <h2 className="text-lg font-bold text-white">Tus Reservas y Pases Digitales</h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    {userBookings.map(b => (
                      <div key={b.id} className="bg-slate-950 p-5 rounded-2xl border border-slate-800 space-y-3">
                        <div className="flex justify-between items-center">
                          <span className="text-xs font-mono text-emerald-400 font-bold">{b.id}</span>
                          <span className="text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full font-bold">Reserva Activa</span>
                        </div>
                        <div>
                          <h3 className="font-bold text-white">{b.spaceTitle}</h3>
                          <p className="text-xs text-slate-400">{b.address} ({b.city})</p>
                        </div>
                        <div className="bg-slate-900 p-3 rounded-xl flex justify-between items-center border border-slate-800">
                          <div>
                            <span className="text-[10px] text-slate-500 block uppercase font-bold">PIN Teclado Garaje</span>
                            <span className="text-xl font-mono font-black text-emerald-400">{b.pinCode}</span>
                          </div>
                          <button onClick={() => alert("¡Puerta abriéndose por Bluetooth!")} className="bg-emerald-500 text-slate-950 font-bold text-xs px-3 py-2 rounded-xl">
                            Abrir Puerta App
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

            </main>
          )}

          {appMode === 'OWNER' && (
            <main className="max-w-6xl mx-auto w-full p-4 sm:p-6 space-y-6 flex-1">
              <div className="bg-slate-950 p-6 rounded-2xl border border-slate-800 text-center space-y-4">
                <h2 className="text-xl font-bold">Panel del Propietario</h2>
                <p className="text-xs text-slate-400">Publica tu plaza cuando salgas de viaje o estés trabajando.</p>
                <button onClick={() => alert('Plaza registrada')} className="bg-violet-600 text-white font-bold text-xs px-4 py-2 rounded-xl">
                  + Publicar Plaza Nueva
                </button>
              </div>
            </main>
          )}

          {selectedSpace && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-slate-900 p-6 rounded-3xl max-w-sm w-full border border-slate-700 space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white text-base">Confirmar Reserva</h3>
                  <button onClick={() => setSelectedSpace(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div>
                  <h4 className="font-bold text-emerald-400">{selectedSpace.title}</h4>
                  <p className="text-xs text-slate-400">{selectedSpace.address} ({selectedSpace.city})</p>
                </div>
                <div>
                  <label className="text-xs font-bold text-slate-400 block mb-1">Horas estimadas:</label>
                  <input 
                    type="number" 
                    min="1" 
                    max="48"
                    value={hours}
                    onChange={e => setHours(parseInt(e.target.value) || 1)}
                    className="w-full bg-slate-950 border border-slate-700 px-3 py-2 rounded-xl text-sm text-white"
                  />
                </div>
                <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 text-xs space-y-1">
                  <div className="flex justify-between text-slate-400"><span>Plaza ({hours}h):</span><span>{(selectedSpace.pricePerHour * hours).toFixed(2)} €</span></div>
                  <div className="flex justify-between text-slate-400"><span>Seguro ParkCover:</span><span>1.20 €</span></div>
                  <div className="flex justify-between font-bold text-white pt-1 border-t border-slate-800 text-sm"><span>Total:</span><span className="text-emerald-400">{(selectedSpace.pricePerHour * hours + 1.20).toFixed(2)} €</span></div>
                </div>
                <button 
                  onClick={handleConfirmBooking}
                  className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black rounded-xl text-sm">
                  Pagar y Obtener Código PIN
                </button>
              </div>
            </div>
          )}

          <footer className="border-t border-slate-800 bg-slate-950 py-4 text-center text-xs text-slate-500">
            BlaParkCar España © 2026 - Red de Garajes entre Particulares.
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // DETECTOR DE INSTALACIÓN PWA AUTOMÁTICO EN MÓVILES
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('pwa-install-banner').classList.remove('hidden');

      document.getElementById('pwa-btn-install').addEventListener('click', () => {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; });
      });
    });
  </script>
</body>
</html>
